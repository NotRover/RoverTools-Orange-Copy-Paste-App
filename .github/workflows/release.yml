name: Release (manual)

# The run's title in the Actions list. Evaluated at dispatch, so it can only name
# the inputs — the version is computed later and isn't knowable here. Worth it
# anyway: "#6" tells you nothing, and the one thing you want to see at a glance
# is whether a run was a beta, a rehearsal, or the real thing.
run-name: >-
  release · ${{ inputs.bump }} ·
  ${{ inputs.prerelease && 'beta' || 'stable' }} ·
  ${{ inputs.dry_run && 'dry run' || 'publish' }}

# Releasing is one run of this workflow. Click "Run workflow" in the Actions tab,
# or `gh workflow run release.yml`. Every input has a working default, so a bare
# run is a real patch release.
#
# What it does, in order:
#   1. Checks its own prerequisites and stops with an actionable message if any
#      are missing — before spending a build.
#   2. Bumps the version, and collects the commit subjects since the last release
#      tag as the notes users will read.
#   3. Builds signed Windows (NSIS) and Linux (AppImage + deb) bundles.
#   4. Assembles `latest.json` and publishes a GitHub Release on this repo,
#      which is what the app's updater reads.
#
# Two escape hatches, both off by default:
#   dry_run     build and verify, publish nothing. For after editing this file.
#   prerelease  publish as a beta: offered only to installs that opted in under
#               Settings → Updates, invisible to the stable feed. Promoting it
#               later is an edit of the same bundles, not another build.
#
# Required secrets (see docs/releasing.md):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Releases publish to this same repo with the built-in GITHUB_TOKEN — no PAT needed.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        default: patch
        options:
          - patch # 0.2.0 -> 0.2.1  bug fixes
          - minor # 0.2.0 -> 0.3.0  new features
          - major # 0.2.0 -> 1.0.0  breaking changes, or committing to 1.0
      dry_run:
        description: "Rehearse: build and verify, but publish nothing"
        type: boolean
        default: false
      prerelease:
        description: "Beta: publish, but keep it out of the update feed"
        type: boolean
        default: false

env:
  # Releases publish to this same repo (`github.repository`). Its GitHub Releases
  # hold the binaries and `latest.json`, and are what tauri.conf.json's updater
  # endpoint points at. No separate releases repo: the source repo is public, so
  # the updater can fetch the feed from here with no credentials.
  APP_DIR: orange-copy-paste-clipboard-app-rust
  # Space-free bundle prefix. GitHub rewrites spaces in uploaded asset names to
  # dots, which would silently break every URL in latest.json — so the bundles are
  # renamed to this before upload and the URLs are built from the new names.
  ASSET_PREFIX: RoverTools

jobs:
  # ── 1. Check prerequisites, decide the version, collect the notes ───────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push the tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Whole history and every tag: the notes are the commits since the last
          # release tag, so both have to be present.
          fetch-depth: 0
          submodules: false

      - name: Check prerequisites
        # All of it up front, before a build is spent. Each of these fails
        # silently or expensively otherwise, and the message says what to do
        # rather than what went wrong.
        #
        # Only whether each secret is set reaches this step, never its value: the
        # signing key is in exactly one environment, the `tauri build` step below.
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          set -uo pipefail
          fail=0
          bad() { echo "::error::$1"; fail=1; }

          # A build with the placeholder key succeeds and is then rejected by
          # every client — the one failure that is invisible until users are stuck.
          if grep -q 'REPLACE_ME_WITH_TAURI_SIGNER_PUBLIC_KEY' "$APP_DIR/src-tauri/tauri.conf.json"; then
            bad "The updater pubkey in tauri.conf.json is still the placeholder. Generate a keypair (docs/releasing.md step 1) and commit the public half, or every client will reject this release."
          fi

          [ "$HAS_SIGNING_KEY" = "true" ] || bad "Secret TAURI_SIGNING_PRIVATE_KEY is not set. Bundles would be unsigned and unusable as updates."
          [ "$HAS_SIGNING_PASSWORD" = "true" ] || bad "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set."

          [ "$fail" -eq 0 ] || exit 1
          echo "All prerequisites present."

      - name: Collect release notes
        # First thing after the prerequisite gate, and before anything is built or
        # bumped: an empty changelog should fail the run in seconds, not after a
        # matrix build. The notes are `changelog/next.md`, written by a human — or by
        # `/update-changelog` — before the release. The workflow only reads and
        # publishes them; nothing is derived from commit subjects. See docs/releasing.md
        # and changelog/README.md.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          src=changelog/next.md

          # Only plain vX.Y.Z tags count as a prior release — the `v0.1.0-build.N`
          # tags from build-linux.yml are throwaway CI builds. Used solely to tell the
          # first release (which legitimately has no notes) from a later one that
          # forgot them. `|| true`: no tag yet is exactly the first release.
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          if [ -f "$src" ]; then
            # 1. Strip the HTML guidance comment (perl spans the multi-line block).
            # 2. Drop the "### Internal" section whole — backend, MCP plumbing, CI,
            #    docs and dependency bumps are kept in the file for the record but are
            #    never shown to users. Skip from that heading to the next heading.
            # 3. Drop any remaining "### Section" with no body — an untouched template
            #    is empty headings, and those must never reach users. The awk withholds
            #    a heading until a content line follows it; a heading followed only by
            #    another heading (or EOF) is dropped. Lead lines pass straight through.
            # 4. Fold typographic punctuation to ASCII — a stray em dash in the
            #    changelog would otherwise carry into the app's "What's new" panel.
            # 5. Trim blank lines from both ends (sed twice around tac).
            perl -0777 -pe 's/<!--.*?-->//gs' "$src" \
              | awk '
                  /^#{1,6}[[:space:]]+[Ii]nternal[[:space:]]*$/ { skip=1; next }
                  /^#{1,6}[[:space:]]/ { skip=0 }
                  !skip { print }
                ' \
              | awk '
                  /^#{1,6}[[:space:]]/ { pending=$0; next }
                  /[^[:space:]]/ { if (pending!="") { print pending; pending="" } print; next }
                  { if (pending=="") print "" }
                ' \
              | sed -e 's/—/-/g' -e 's/–/-/g' -e 's/“/"/g' -e 's/”/"/g' -e "s/’/'/g" -e "s/‘/'/g" -e 's/…/.../g' \
              | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac \
              > RELEASE_NOTES.md || true
          fi

          # No real notes staged. First release gets a one-liner (nobody updates *to* a
          # first release). A dry run gets a placeholder so the rehearsal can proceed.
          # A real, non-first release FAILS here — write the notes before shipping,
          # which is the whole point of the enforcement.
          if [ ! -f RELEASE_NOTES.md ] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            if [ -z "$last" ]; then
              echo "No previous release and no staged notes — first release."
              echo "First release." > RELEASE_NOTES.md
            elif [ "$DRY_RUN" = "true" ]; then
              echo "::warning::changelog/next.md is empty — using a placeholder for this rehearsal."
              echo "- Maintenance and internal improvements." > RELEASE_NOTES.md
            else
              echo "::error::changelog/next.md has no release notes. Draft them (run /update-changelog) and commit changelog/next.md before releasing."
              exit 1
            fi
          fi

          echo "── release notes ──"
          cat RELEASE_NOTES.md

      - name: Install cargo-edit
        # `cargo set-version` keeps Cargo.toml and Cargo.lock consistent, which
        # hand-editing the version does not.
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-edit

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' "$APP_DIR/src-tauri/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')
          echo "Current version: $current"

          IFS=. read -r maj min pat <<< "$current"
          case "$BUMP" in
            major) next="$((maj + 1)).0.0" ;;
            minor) next="${maj}.$((min + 1)).0" ;;
            patch) next="${maj}.${min}.$((pat + 1))" ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac

          # The updater compares semver, so a version it cannot parse would be
          # published and then never offered to anyone. Fail here instead.
          if ! printf '%s' "$next" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved version '$next' is not a plain X.Y.Z semver."
            exit 1
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Cargo.toml is the single source of truth — tauri.conf.json has no
          # `version` field and falls back to this one.
          (cd src-tauri && cargo set-version "$VERSION")
          # Cosmetic, but a package.json that disagrees is a trap for the next reader.
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git diff --stat

      - name: Write the run summary
        # `run-name` is fixed when the run is created, before the version exists,
        # and a run cannot be renamed afterwards. This panel is the first place
        # the run page can state what is actually being cut.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            channel="beta — offered only to installs opted into beta versions"
          else
            channel="stable — offered to everyone"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mode="dry run — builds and verifies, publishes nothing"
          else
            mode="publish"
          fi

          {
            echo "## $TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` (\`$BUMP\` bump) |"
            echo "| Channel | $channel |"
            echo "| Mode | $mode |"
            echo
            echo "### Release notes"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        # Passed to the publish job as a file: multi-line job outputs get mangled.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Stamp the changelog
        # Only on a real publish: a dry run reads next.md for the notes but leaves the
        # directory untouched, so nothing is committed for a rehearsal.
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          if [ "$PRERELEASE" = "true" ]; then channel=beta; else channel=stable; fi

          # Turn the staged notes into a permanent, self-describing release file, then
          # open a fresh next.md from the template. The filename states the version,
          # the bump and the channel — all known here, none of them guessed — so the
          # directory reads like the run-name: 0.2.0-minor-stable.md, 0.1.14-patch-beta.md.
          # The file body is exactly what shipped (RELEASE_NOTES.md), under a heading
          # that repeats the same facts for anyone opening the file directly.
          dest="changelog/${VERSION}-${BUMP}-${channel}.md"
          {
            echo "# ${VERSION} (${BUMP}, ${channel}) - ${date}"
            echo
            cat RELEASE_NOTES.md
          } > "$dest"
          cp changelog/TEMPLATE.md changelog/next.md

          # Rebuild the browsable index at the repo root from every per-release file,
          # this new one included. Generated artifact — the source stays in changelog/.
          bash .github/scripts/gen-changelog.sh changelog > CHANGELOG.md

          echo "── new release file: $dest ──"
          cat "$dest"
          echo "── changelog/next.md reset to the empty template, CHANGELOG.md rebuilt ──"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/package.json" "$APP_DIR/src-tauri/Cargo.toml" \
                  "$APP_DIR/src-tauri/Cargo.lock" changelog/ CHANGELOG.md
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$TAG"

  # ── 2. Build signed bundles ────────────────────────────────────────────────
  build:
    needs: prepare
    # The version isn't known at dispatch, so `run-name` above can't carry it.
    # Job names are resolved after `prepare`, which is the earliest anything can
    # say which version is being built.
    name: build ${{ needs.prepare.outputs.tag }} (${{ matrix.artifact }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS is the Windows target the updater can install; the AppImage is
          # the Linux one. The .deb rides along as a manual download — a package
          # manager install cannot be replaced by a self-update.
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Same toolchain as build-linux.yml. 22.04 on purpose: the binary links
        # against this image's glibc/webkit, and a bundle built on a newer image
        # will not run on older distros.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target
          key: ${{ matrix.artifact }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-edit

      - name: Apply release version
        # Re-applied here rather than checked out from the release commit, so a
        # dry run builds the real bundles without anything having been pushed.
        working-directory: ${{ env.APP_DIR }}/src-tauri
        run: cargo set-version ${{ needs.prepare.outputs.version }}

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        # --frozen-lockfile: install exactly what bun.lock names, and fail rather
        # than resolve something newer into a signed release.
        run: bun install --frozen-lockfile

      - name: Build bundles
        working-directory: ${{ env.APP_DIR }}
        # The only step that sees the signing key: step-level env, not job-level,
        # so no other step (and no action it runs) can read it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Collect and rename bundles
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out=staging
          mkdir -p "$out"
          bundle="$APP_DIR/src-tauri/target/release/bundle"

          # Renaming to a space-free prefix, keeping each .sig next to its bundle.
          # A signature covers bytes, not filenames, so renaming is safe.
          # `if` rather than `[ … ] && cp`: a bare test that fails is a non-zero
          # command mid-function, which `set -e` treats as fatal.
          copy() {
            src="$1"; dest="$2"
            [ -f "$src" ] || return 0
            cp "$src" "$out/$dest"
            if [ -f "$src.sig" ]; then cp "$src.sig" "$out/$dest.sig"; fi
            echo "  $dest"
          }

          echo "Staging:"
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_x64-setup.exe"
          done < <(find "$bundle/nsis" -name '*-setup.exe' 2>/dev/null || true)
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_amd64.AppImage"
          done < <(find "$bundle/appimage" -name '*.AppImage' 2>/dev/null || true)
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_amd64.deb"
          done < <(find "$bundle/deb" -name '*.deb' 2>/dev/null || true)

          # An updatable target with no .sig means the signing step silently did
          # nothing; publishing that ships a release no client will accept.
          for f in "$out"/*-setup.exe "$out"/*.AppImage; do
            [ -e "$f" ] || continue
            if [ ! -f "$f.sig" ]; then
              echo "::error::$f has no .sig — check createUpdaterArtifacts and the signing secrets."
              exit 1
            fi
          done
          ls -la "$out"

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  # ── 3. Publish a GitHub Release on this repo ────────────────────────────────
  publish:
    needs: [prepare, build]
    name: publish ${{ needs.prepare.outputs.tag }}
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, commit beta.json
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Assemble release assets and latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' \) \
            -exec cp {} release/ \;

          notes=$(cat artifacts/release-notes/RELEASE_NOTES.md)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # The feed the app reads. Only the two self-updatable targets appear —
          # a .deb entry here would offer an update the client cannot install.
          platforms=$(jq -n '{}')
          add_platform() {
            target="$1"; file="$2"
            [ -f "release/$file" ] || return 0
            sig=$(cat "release/$file.sig")
            platforms=$(jq --arg t "$target" --arg s "$sig" --arg u "$base/$file" \
              '.[$t] = { signature: $s, url: $u }' <<< "$platforms")
            echo "  $target -> $file"
          }
          echo "Feed platforms:"
          add_platform windows-x86_64 "RoverTools_${VERSION}_x64-setup.exe"
          add_platform linux-x86_64   "RoverTools_${VERSION}_amd64.AppImage"

          if [ "$(jq 'length' <<< "$platforms")" -eq 0 ]; then
            echo "::error::latest.json would have no platforms — nothing to serve."
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > release/latest.json

          cat release/latest.json

      - name: Publish release
        env:
          # The built-in token: the release lands on this same repo, so the
          # workflow token's contents:write is enough — no PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # `releases/latest/download/latest.json` resolves to the newest
          # NON-prerelease, which is what keeps a beta away from the stable
          # channel: a prerelease is published and simply never served there.
          # Beta subscribers reach it through beta.json instead (next step).
          # `--latest` and `--prerelease` contradict each other, so it is one or
          # the other.
          if [ "$PRERELEASE" = "true" ]; then
            visibility=(--prerelease)
            echo "Publishing $TAG as a PRERELEASE — stable installs will not be offered it."
          else
            visibility=(--latest)
            echo "Publishing $TAG as the latest release — the update feed will serve it."
          fi

          # The GitHub release body gets a SmartScreen footer; `latest.json` does
          # not. The bundles carry no Authenticode signature, so Windows shows
          # "unrecognized app" on a downloaded installer — an unexplained warning
          # is what makes people abandon an install. In-app updates never hit it
          # (the app fetches the installer itself, so no Mark of the Web), which
          # is exactly why the footer would be noise in the updater's notes.
          cp artifacts/release-notes/RELEASE_NOTES.md RELEASE_BODY.md
          cat >> RELEASE_BODY.md <<'FOOTER'

          ---

          **Windows will warn you the first time.** The installer isn't signed with a
          paid code-signing certificate, so SmartScreen shows *"Windows protected your
          PC - unrecognized app"*. Click **More info**, then **Run anyway**.

          You'll see this once, on a manual install. Updates from inside the app don't
          trigger it.
          FOOTER

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file RELEASE_BODY.md \
            "${visibility[@]}" \
            release/*

      - name: Update the beta channel feed
        # Written on EVERY publish, beta or stable, so beta.json always names the
        # newest release of either kind — that is what gives beta subscribers
        # stable releases as well as prereleases.
        #
        # A committed file rather than a release asset: the stable channel gets its
        # mutability from GitHub's own `latest` resolution, and a mutable pointer
        # *release* would either hijack that or have to be excluded from pruning by
        # hand. A committed file has neither problem. It lands on this repo's default
        # branch, which is what the beta endpoint (raw .../HEAD/beta.json) reads.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Updating an existing file needs its blob sha; creating one must omit it.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/beta.json" --jq '.sha' 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/beta.json"
                -f "message=beta channel -> $TAG"
                -f "content=$(base64 -w0 release/latest.json)")
          # `if`, not `[ … ] && …`: a bare test that fails is a non-zero command,
          # which `set -e` treats as fatal — and it fails on the first release,
          # when there is no file to get a sha from.
          if [ -n "$sha" ]; then args+=(-f "sha=$sha"); fi

          gh api "${args[@]}" --jq '.content.path + " @ " + .commit.sha[0:7]'

      - name: Verify the published feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          stable="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

          # A prerelease is not reachable through the `latest` URL — that is the
          # point of it — so verify the feed at its own tag and then confirm the
          # invisibility actually holds.
          if [ "$PRERELEASE" = "true" ]; then
            feed="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"
          else
            # The same URL the app uses, so a broken redirect or a mangled asset
            # name fails here rather than in front of users.
            feed="$stable"
          fi

          served=$(curl -fsSL "$feed")
          echo "$served"
          got=$(jq -r '.version' <<< "$served")
          [ "$got" = "$VERSION" ] || { echo "::error::feed serves $got, expected $VERSION"; exit 1; }

          # Every bundle URL it advertises is actually reachable. A `for` over the
          # expanded list, not `| while read`: a pipeline's loop body runs in a
          # subshell, where `exit 1` ends the subshell and the step still passes.
          # Asset names are renamed to be space-free above, so word splitting here
          # is safe. One byte rather than HEAD — the asset CDN is more consistent
          # about ranged GETs than about HEAD.
          for u in $(jq -r '.platforms[].url' <<< "$served"); do
            curl -fsL -r 0-0 -o /dev/null "$u" || { echo "::error::unreachable: $u"; exit 1; }
            echo "ok: $u"
          done

          # The beta channel must name this release whichever kind it was, since
          # subscribers there get both. Read through the API rather than the raw
          # CDN: raw.githubusercontent caches for minutes, so a fresh commit would
          # flake here for reasons that have nothing to do with the release.
          beta=$(gh api "repos/$GITHUB_REPOSITORY/contents/beta.json" --jq '.content' | base64 -d | jq -r '.version')
          [ "$beta" = "$VERSION" ] || { echo "::error::beta.json serves $beta, expected $VERSION"; exit 1; }
          echo "ok: beta channel serves $beta"

          if [ "$PRERELEASE" = "true" ]; then
            # The guarantee worth checking: installed apps on the STABLE channel
            # still see the previous stable, or nothing at all when this is the
            # first release ever. An unreachable stable feed is a pass here, hence
            # `|| true`.
            public=$(curl -fsSL "$stable" 2>/dev/null | jq -r '.version' 2>/dev/null || true)
            if [ "$public" = "$VERSION" ]; then
              echo "::error::$TAG is marked prerelease but the stable feed is serving it."
              exit 1
            fi
            echo "Stable channel still serves: ${public:-nothing yet} — $TAG is beta-only, as intended."
          fi
