name: Release (manual)

# Releasing is one run of this workflow. Click "Run workflow" in the Actions tab,
# or `gh workflow run release.yml`. Every input has a working default, so a bare
# run is a real patch release.
#
# What it does, in order:
#   1. Checks its own prerequisites and stops with an actionable message if any
#      are missing — before spending a build.
#   2. Bumps the version, and collects the commit subjects since the last release
#      tag as the notes users will read.
#   3. Builds signed Windows (NSIS) and Linux (AppImage + deb) bundles.
#   4. Assembles `latest.json` and publishes everything to the PUBLIC releases
#      repo, which is what the app's updater reads.
#
# Two escape hatches, both off by default:
#   dry_run     build and verify, publish nothing. For after editing this file.
#   prerelease  publish, but stay out of the update feed — a beta testers install
#               by hand. Promoting it later is an edit, not another build.
#
# Required secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   RELEASES_REPO_TOKEN                 PAT with contents:write on RELEASES_REPO

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        default: patch
        options:
          - patch # 0.2.0 -> 0.2.1  bug fixes
          - minor # 0.2.0 -> 0.3.0  new features
          - major # 0.2.0 -> 1.0.0  breaking changes, or committing to 1.0
      dry_run:
        description: "Rehearse: build and verify, but publish nothing"
        type: boolean
        default: false
      prerelease:
        description: "Beta: publish, but keep it out of the update feed"
        type: boolean
        default: false

env:
  # Public, releases-only repo. Source stays private; this holds binaries and
  # `latest.json`, and is what tauri.conf.json's updater endpoint points at.
  RELEASES_REPO: Spectrewolf8/RoverTools-Releases
  APP_DIR: orange-copy-paste-clipboard-app-rust
  # Space-free bundle prefix. GitHub rewrites spaces in uploaded asset names to
  # dots, which would silently break every URL in latest.json — so the bundles are
  # renamed to this before upload and the URLs are built from the new names.
  ASSET_PREFIX: RoverTools

jobs:
  # ── 1. Check prerequisites, decide the version, collect the notes ───────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push the tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Whole history and every tag: the notes are the commits since the last
          # release tag, so both have to be present.
          fetch-depth: 0
          submodules: false

      - name: Check prerequisites
        # All of it up front, before a build is spent. Each of these fails
        # silently or expensively otherwise, and the message says what to do
        # rather than what went wrong.
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          bad() { echo "::error::$1"; fail=1; }

          # A build with the placeholder key succeeds and is then rejected by
          # every client — the one failure that is invisible until users are stuck.
          if grep -q 'REPLACE_ME_WITH_TAURI_SIGNER_PUBLIC_KEY' "$APP_DIR/src-tauri/tauri.conf.json"; then
            bad "The updater pubkey in tauri.conf.json is still the placeholder. Generate a keypair (docs/RELEASING.md step 1) and commit the public half, or every client will reject this release."
          fi

          [ -n "$SIGNING_KEY" ] || bad "Secret TAURI_SIGNING_PRIVATE_KEY is not set. Bundles would be unsigned and unusable as updates."
          [ -n "$SIGNING_PASSWORD" ] || bad "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set."

          # Checked here rather than at publish time, where it would fail only
          # after both platforms have finished building.
          if [ -z "$GH_TOKEN" ]; then
            bad "Secret RELEASES_REPO_TOKEN is not set. Needs a PAT with contents:write on $RELEASES_REPO."
          else
            repo=$(gh repo view "$RELEASES_REPO" --json visibility,defaultBranchRef 2>&1) || repo=""
            if [ -z "$repo" ]; then
              bad "Cannot see $RELEASES_REPO. Create it as a PUBLIC repo with a README, and check RELEASES_REPO_TOKEN grants contents:write on it."
            else
              [ "$(jq -r '.visibility' <<< "$repo")" = "PUBLIC" ] || bad "$RELEASES_REPO must be PUBLIC — the app fetches the update feed with no credentials."
              [ "$(jq -r '.defaultBranchRef.name // ""' <<< "$repo")" != "" ] || bad "$RELEASES_REPO has no commits. Add a README — a release needs a commit to tag."
            fi
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "All prerequisites present."

      - name: Install cargo-edit
        # `cargo set-version` keeps Cargo.toml and Cargo.lock consistent, which
        # hand-editing the version does not.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' "$APP_DIR/src-tauri/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')
          echo "Current version: $current"

          IFS=. read -r maj min pat <<< "$current"
          case "$BUMP" in
            major) next="$((maj + 1)).0.0" ;;
            minor) next="${maj}.$((min + 1)).0" ;;
            patch) next="${maj}.${min}.$((pat + 1))" ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac

          # The updater compares semver, so a version it cannot parse would be
          # published and then never offered to anyone. Fail here instead.
          if ! printf '%s' "$next" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved version '$next' is not a plain X.Y.Z semver."
            exit 1
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Cargo.toml is the single source of truth — tauri.conf.json has no
          # `version` field and falls back to this one.
          (cd src-tauri && cargo set-version "$VERSION")
          # Cosmetic, but a package.json that disagrees is a trap for the next reader.
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git diff --stat

      - name: Collect release notes
        run: |
          set -euo pipefail
          # The commit subjects since the last release, which is what the app shows
          # under "What's new". No filtering by prefix: every commit that landed is
          # a change that shipped, and hiding some of them from the list is how a
          # release ends up describing itself inaccurately.
          #
          # Merge commits are dropped — "Merge pull request #24 from …" says nothing
          # a user can act on, and the branch's own commits are listed anyway.
          # Matched with a regex, not a glob: `v[0-9]*.[0-9]*.[0-9]*` also matches
          # the `v0.1.0-build.N` tags from build-linux.yml, which are throwaway CI
          # builds. Treating one as the last release would silently truncate the
          # notes to "everything since a random CI build".
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          if [ -n "$last" ]; then
            echo "Notes cover $last..HEAD"
            git log --no-merges --pretty='format:- %s' "$last..HEAD" > RELEASE_NOTES.md
          else
            # No previous release: listing the entire history would put hundreds of
            # bullets in the update prompt, and nobody is updating *to* a first
            # release anyway — they install it.
            echo "No previous release tag — first release."
            echo "First release." > RELEASE_NOTES.md
          fi

          # An empty file would publish a release with a blank body.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No code changes since $last." > RELEASE_NOTES.md
          fi

          echo "── release notes ──"
          cat RELEASE_NOTES.md

      - name: Upload release notes
        # Passed to the publish job as a file: multi-line job outputs get mangled.
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/package.json" "$APP_DIR/src-tauri/Cargo.toml" \
                  "$APP_DIR/src-tauri/Cargo.lock"
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$TAG"

  # ── 2. Build signed bundles ────────────────────────────────────────────────
  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS is the Windows target the updater can install; the AppImage is
          # the Linux one. The .deb rides along as a manual download — a package
          # manager install cannot be replaced by a self-update.
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Same toolchain as build-linux.yml. 22.04 on purpose: the binary links
        # against this image's glibc/webkit, and a bundle built on a newer image
        # will not run on older distros.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target
          key: ${{ matrix.artifact }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Apply release version
        # Re-applied here rather than checked out from the release commit, so a
        # dry run builds the real bundles without anything having been pushed.
        working-directory: ${{ env.APP_DIR }}/src-tauri
        run: cargo set-version ${{ needs.prepare.outputs.version }}

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install

      - name: Build bundles
        working-directory: ${{ env.APP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Collect and rename bundles
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out=staging
          mkdir -p "$out"
          bundle="$APP_DIR/src-tauri/target/release/bundle"

          # Renaming to a space-free prefix, keeping each .sig next to its bundle.
          # A signature covers bytes, not filenames, so renaming is safe.
          # `if` rather than `[ … ] && cp`: a bare test that fails is a non-zero
          # command mid-function, which `set -e` treats as fatal.
          copy() {
            src="$1"; dest="$2"
            [ -f "$src" ] || return 0
            cp "$src" "$out/$dest"
            if [ -f "$src.sig" ]; then cp "$src.sig" "$out/$dest.sig"; fi
            echo "  $dest"
          }

          echo "Staging:"
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_x64-setup.exe"
          done < <(find "$bundle/nsis" -name '*-setup.exe' 2>/dev/null || true)
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_amd64.AppImage"
          done < <(find "$bundle/appimage" -name '*.AppImage' 2>/dev/null || true)
          while IFS= read -r f; do
            copy "$f" "${ASSET_PREFIX}_${VERSION}_amd64.deb"
          done < <(find "$bundle/deb" -name '*.deb' 2>/dev/null || true)

          # An updatable target with no .sig means the signing step silently did
          # nothing; publishing that ships a release no client will accept.
          for f in "$out"/*-setup.exe "$out"/*.AppImage; do
            [ -e "$f" ] || continue
            if [ ! -f "$f.sig" ]; then
              echo "::error::$f has no .sig — check createUpdaterArtifacts and the signing secrets."
              exit 1
            fi
          done
          ls -la "$out"

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  # ── 3. Publish to the public releases repo ─────────────────────────────────
  publish:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble release assets and latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' \) \
            -exec cp {} release/ \;

          notes=$(cat artifacts/release-notes/RELEASE_NOTES.md)
          base="https://github.com/${RELEASES_REPO}/releases/download/${TAG}"

          # The feed the app reads. Only the two self-updatable targets appear —
          # a .deb entry here would offer an update the client cannot install.
          platforms=$(jq -n '{}')
          add_platform() {
            target="$1"; file="$2"
            [ -f "release/$file" ] || return 0
            sig=$(cat "release/$file.sig")
            platforms=$(jq --arg t "$target" --arg s "$sig" --arg u "$base/$file" \
              '.[$t] = { signature: $s, url: $u }' <<< "$platforms")
            echo "  $target -> $file"
          }
          echo "Feed platforms:"
          add_platform windows-x86_64 "RoverTools_${VERSION}_x64-setup.exe"
          add_platform linux-x86_64   "RoverTools_${VERSION}_amd64.AppImage"

          if [ "$(jq 'length' <<< "$platforms")" -eq 0 ]; then
            echo "::error::latest.json would have no platforms — nothing to serve."
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > release/latest.json

          cat release/latest.json

      - name: Publish release
        env:
          # A PAT: the workflow token is scoped to this repo and cannot write to
          # the releases repo.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # `releases/latest/download/latest.json` resolves to the newest
          # NON-prerelease, which is what keeps a beta away from the stable
          # channel: a prerelease is published and simply never served there.
          # Beta subscribers reach it through beta.json instead (next step).
          # `--latest` and `--prerelease` contradict each other, so it is one or
          # the other.
          if [ "$PRERELEASE" = "true" ]; then
            visibility=(--prerelease)
            echo "Publishing $TAG as a PRERELEASE — stable installs will not be offered it."
          else
            visibility=(--latest)
            echo "Publishing $TAG as the latest release — the update feed will serve it."
          fi

          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "$TAG" \
            --notes-file artifacts/release-notes/RELEASE_NOTES.md \
            "${visibility[@]}" \
            release/*

      - name: Update the beta channel feed
        # Written on EVERY publish, beta or stable, so beta.json always names the
        # newest release of either kind — that is what gives beta subscribers
        # stable releases as well as prereleases.
        #
        # A file in the releases repo rather than a release asset: the stable
        # channel gets its mutability from GitHub's own `latest` resolution, and a
        # mutable pointer *release* would either hijack that or have to be excluded
        # from pruning by hand. A committed file has neither problem.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Updating an existing file needs its blob sha; creating one must omit it.
          sha=$(gh api "repos/$RELEASES_REPO/contents/beta.json" --jq '.sha' 2>/dev/null || true)
          args=(--method PUT "repos/$RELEASES_REPO/contents/beta.json"
                -f "message=beta channel -> $TAG"
                -f "content=$(base64 -w0 release/latest.json)")
          # `if`, not `[ … ] && …`: a bare test that fails is a non-zero command,
          # which `set -e` treats as fatal — and it fails on the first release,
          # when there is no file to get a sha from.
          if [ -n "$sha" ]; then args+=(-f "sha=$sha"); fi

          gh api "${args[@]}" --jq '.content.path + " @ " + .commit.sha[0:7]'

      - name: Verify the published feed
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          stable="https://github.com/${RELEASES_REPO}/releases/latest/download/latest.json"

          # A prerelease is not reachable through the `latest` URL — that is the
          # point of it — so verify the feed at its own tag and then confirm the
          # invisibility actually holds.
          if [ "$PRERELEASE" = "true" ]; then
            feed="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/latest.json"
          else
            # The same URL the app uses, so a broken redirect or a mangled asset
            # name fails here rather than in front of users.
            feed="$stable"
          fi

          served=$(curl -fsSL "$feed")
          echo "$served"
          got=$(jq -r '.version' <<< "$served")
          [ "$got" = "$VERSION" ] || { echo "::error::feed serves $got, expected $VERSION"; exit 1; }

          # Every bundle URL it advertises is actually reachable. A `for` over the
          # expanded list, not `| while read`: a pipeline's loop body runs in a
          # subshell, where `exit 1` ends the subshell and the step still passes.
          # Asset names are renamed to be space-free above, so word splitting here
          # is safe. One byte rather than HEAD — the asset CDN is more consistent
          # about ranged GETs than about HEAD.
          for u in $(jq -r '.platforms[].url' <<< "$served"); do
            curl -fsL -r 0-0 -o /dev/null "$u" || { echo "::error::unreachable: $u"; exit 1; }
            echo "ok: $u"
          done

          # The beta channel must name this release whichever kind it was, since
          # subscribers there get both. Read through the API rather than the raw
          # CDN: raw.githubusercontent caches for minutes, so a fresh commit would
          # flake here for reasons that have nothing to do with the release.
          beta=$(gh api "repos/$RELEASES_REPO/contents/beta.json" --jq '.content' | base64 -d | jq -r '.version')
          [ "$beta" = "$VERSION" ] || { echo "::error::beta.json serves $beta, expected $VERSION"; exit 1; }
          echo "ok: beta channel serves $beta"

          if [ "$PRERELEASE" = "true" ]; then
            # The guarantee worth checking: installed apps on the STABLE channel
            # still see the previous stable, or nothing at all when this is the
            # first release ever. An unreachable stable feed is a pass here, hence
            # `|| true`.
            public=$(curl -fsSL "$stable" 2>/dev/null | jq -r '.version' 2>/dev/null || true)
            if [ "$public" = "$VERSION" ]; then
              echo "::error::$TAG is marked prerelease but the stable feed is serving it."
              exit 1
            fi
            echo "Stable channel still serves: ${public:-nothing yet} — $TAG is beta-only, as intended."
          fi

      - name: Prune old releases (keep last 5)
        # Storage hygiene. Sorted newest-first and sliced from index 5, so the
        # release the updater is currently serving is never a candidate.
        # Best-effort — cleanup problems never fail a successful release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          KEEP: 5
        run: |
          gh release list --repo "$RELEASES_REPO" --limit 100 --json tagName,createdAt,isLatest \
            --jq "[.[] | select(.isLatest | not)] | sort_by(.createdAt) | reverse | .[$((KEEP - 1)):] | .[].tagName" \
            | while read -r t; do
                [ -z "$t" ] && continue
                echo "Deleting old release+tag: $t"
                gh release delete "$t" --repo "$RELEASES_REPO" --yes --cleanup-tag
              done
