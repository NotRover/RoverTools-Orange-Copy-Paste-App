name: Redeploy docs site

run-name: >-
  redeploy site (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'docs push' }})

# The public site (Cloudflare Pages) regenerates its Developers > Reference pages
# from the docs in this repo at build time - but Pages only rebuilds on a push to
# the WEBSITE repo, and these docs live here. So a client/workspace doc edit would
# sit unpublished until something else happened to trigger a site build.
#
# This closes that gap: a push to main that touches a mirrored doc pings the site's
# Cloudflare Pages Deploy Hook, which starts a fresh build. That build re-runs
# scripts/pull-dev-docs.mjs and pulls this doc's new content from GitHub raw main.
#
# Mirrored sources in THIS repo (see the website's scripts/pull-dev-docs.mjs):
#   - orange-copy-paste-clipboard-app-rust/docs/architecture.md   (client internals)
#   - orange-copy-paste-clipboard-app-rust/docs/bugfix-history.md
#   - docs/architecture.md                                        (architecture map)
#   - docs/permissions.md
#   - docs/releasing.md
# The backend doc is mirrored too, but from the backend repo, which has its own copy
# of this workflow.
#
# Needs one repository secret, SITE_DEPLOY_HOOK, holding the Cloudflare Pages Deploy
# Hook URL for the site (Pages project > Settings > Builds & deployments > Deploy
# hooks). The job no-ops with a clear message if the secret is absent, so a fork or
# an unconfigured repo does not turn red.

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture.md'
      - 'docs/permissions.md'
      - 'docs/releasing.md'
      - 'orange-copy-paste-clipboard-app-rust/docs/architecture.md'
      - 'orange-copy-paste-clipboard-app-rust/docs/bugfix-history.md'
  workflow_dispatch:

# One site build at a time; a burst of doc commits collapses to the latest.
concurrency:
  group: redeploy-site
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not set; nothing to trigger. Skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Requested a Cloudflare Pages rebuild."
