[package]
name = "notrover-smart-clipboard-app-rust"
version = "0.0.0"
description = "Smart Clipboard – Tauri/Rust port of the Electron clipboard manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notrover_smart_clipboard_app_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
# A `parking_lot` guard in an `if let`/`match` scrutinee lives until the end of
# the whole block, so anything the block calls runs with the lock still held.
# These locks are neither reentrant nor poisoning: re-taking one deadlocks
# silently, with no panic for the health latch to catch. Hoist the value into a
# `let` first so the guard dies at the end of that statement.
significant_drop_in_scrutinee = "warn"
# A guard held across `.await` is the same hazard, plus it blocks the executor
# thread. Currently zero occurrences in the async sync engine — keep it that way.
await_holding_lock = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Single-instance: routes a second launch's CLI args to the running instance.
# Backs the `--trigger copy|paste` popup trigger, which is the reliable way to
# fire the shortcuts on Wayland compositors that don't deliver global hotkeys.
tauri-plugin-single-instance = "2"
# Self-update: checks a signed static release feed, downloads and swaps the app
# in place. Bundles must carry a signature made with the private half of the key
# in `tauri.conf.json`, which is what makes a plain static feed safe to trust.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard access (text + images)
arboard = "3"

# Image encoding/decoding for clipboard image → PNG data-URL conversion
image = { version = "0.25", default-features = false, features = ["png"] }

# Base64 encoding for clipboard image data URLs
base64 = "0.22"

# Binary serialisation (MessagePack) for history persistence
rmp-serde = "1"

# Ergonomic lock primitives (no poisoning, direct lock() → MutexGuard)
parking_lot = "0.12"
uuid = { version = "1.23.4", features = ["v4"] }

# ── Cloud sync dependencies ──────────────────────────────────────────────────
# These are loaded only when the sync module is active (runtime-gated by
# sync_enabled setting).  They are compiled unconditionally so the binary is
# always sync-capable without a separate feature build.

# Async HTTP client (rustls TLS, no native-tls dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async runtime for the sync module's dedicated background thread pool
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# Async WebSocket client (rustls TLS with bundled WebPKI certificate roots)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
# Futures utilities (Stream/Sink combinators for the WS listener)
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Argon2id — User Master Key derivation
argon2 = "0.5"
# AES-256-GCM — symmetric content encryption
aes-gcm = "0.10"
# SHA-256 — blob checksum for the upload contract
sha2 = "0.10"
# X25519 ECDH — multi-device key exchange and group key wrapping
x25519-dalek = { version = "2", features = ["static_secrets"] }
# OS credential store (Windows Credential Manager / macOS Keychain / libsecret)
keyring = "2"
# Zeroize — scrub key material from memory on drop
zeroize = { version = "1", features = ["derive"] }
# Open the system browser for the OAuth authorization hop
open = "5"

#  Windows-only  key simulation (keybd_event / GetCursorPos / monitor info)
#  NOTE: keep this target table LAST — any `dep = ...` lines after a target
#  table header belong to that table, so cross-platform deps must precede it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "z"   # optimize for binary size
lto = true        # enable link-time optimization
codegen-units = 1 # single codegen unit for better optimization
strip = true      # strip debug symbols
# `panic = "abort"` is deliberately NOT set. It saves some binary size, but it
# turns a panic on any background thread — sync worker, clipboard watcher — into
# a dead app. Unwinding keeps the panic local to that thread, and the panic hook
# still records it to crash.log either way.
