[package]
name = "notrover-smart-clipboard-app-rust"
version = "0.1.0"
description = "Smart Clipboard – Tauri/Rust port of the Electron clipboard manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notrover_smart_clipboard_app_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard access (text + images)
arboard = "3"

# Image encoding/decoding for clipboard image → PNG data-URL conversion
image = { version = "0.25", default-features = false, features = ["png"] }

# Base64 encoding for clipboard image data URLs
base64 = "0.22"

# Ergonomic lock primitives (no poisoning, direct lock() → MutexGuard)
parking_lot = "0.12"

#  Windows-only  key simulation (keybd_event / GetCursorPos / monitor info)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "z"   # optimize for binary size
lto = true        # enable link-time optimization
codegen-units = 1 # single codegen unit for better optimization
panic = "abort"   # remove panic unwinding code
strip = true      # strip debug symbols
